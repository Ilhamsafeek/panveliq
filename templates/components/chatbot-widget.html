<div class="chatbot-widget" id="chatbotWidget">
    <!-- Chatbot Button -->
    <button class="chatbot-button" id="chatbotButton">
        <i class="ti ti-message-chatbot"></i>
        <span class="chatbot-badge" id="chatbotBadge" style="display: none;">1</span>
    </button>
    
    <!-- Chatbot Window -->
    <div class="chatbot-window" id="chatbotWindow">
        <!-- Header -->
        <div class="chatbot-header">
            <div class="chatbot-header-info">
                <div class="chatbot-avatar">
                    <i class="ti ti-robot"></i>
                </div>
                <div>
                    <h4>PanvelIQ Assistant</h4>
                    <p class="chatbot-status">
                        <span class="status-dot"></span>
                        Online
                    </p>
                </div>
            </div>
            <div class="chatbot-header-actions">
                <button class="chatbot-action-btn" id="minimizeChatbot">
                    <i class="ti ti-minus"></i>
                </button>
                <button class="chatbot-action-btn" id="closeChatbot">
                    <i class="ti ti-x"></i>
                </button>
            </div>
        </div>
        
        <!-- Messages -->
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="chatbot-message bot">
                <div class="message-avatar">
                    <i class="ti ti-robot"></i>
                </div>
                <div class="message-content">
                    <p>Hello! I'm your PanvelIQ Assistant. How can I help you today?</p>
                    <span class="message-time" id="welcomeTime"></span>
                </div>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <div class="chatbot-quick-actions" id="quickActions">
            <button class="quick-action-btn" data-message="Tell me about my package">
                <i class="ti ti-package"></i>
                My Package
            </button>
            <button class="quick-action-btn" data-message="Show my campaign performance">
                <i class="ti ti-chart-bar"></i>
                Performance
            </button>
            <button class="quick-action-btn" data-message="I need help with content creation">
                <i class="ti ti-help"></i>
                Get Help
            </button>
        </div>
        
        <!-- Typing Indicator -->
        <div class="chatbot-typing" id="typingIndicator" style="display: none;">
            <div class="message-avatar">
                <i class="ti ti-robot"></i>
            </div>
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <!-- Input -->
        <div class="chatbot-input">
            <textarea 
                id="chatbotTextarea" 
                placeholder="Type your message..." 
                rows="1"
            ></textarea>
            <button class="chatbot-send-btn" id="chatbotSend">
                <i class="ti ti-send"></i>
            </button>
        </div>
    </div>
</div>

<style>
    .chatbot-widget {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 9999;
    }
    
    /* Chatbot Button */
    .chatbot-button {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--gradient-primary);
        border: none;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        box-shadow: 0 8px 24px rgba(153, 38, 243, 0.4);
        transition: all 0.3s;
        position: relative;
    }
    
    .chatbot-button:hover {
        transform: scale(1.1);
        box-shadow: 0 12px 32px rgba(153, 38, 243, 0.5);
    }
    
    .chatbot-button.active {
        transform: scale(0.9);
    }
    
    .chatbot-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        width: 22px;
        height: 22px;
        background: var(--color-error);
        color: white;
        border-radius: 50%;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid white;
    }
    
    /* Chatbot Window */
    .chatbot-window {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 400px;
        height: 600px;
        background: white;
        border-radius: var(--radius-xl);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        display: none;
        flex-direction: column;
        overflow: hidden;
    }
    
    .chatbot-window.active {
        display: flex;
        animation: slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Header */
    .chatbot-header {
        background: var(--gradient-primary);
        color: white;
        padding: 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .chatbot-header-info {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }
    
    .chatbot-avatar {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
    }
    
    .chatbot-header-info h4 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 0.25rem;
    }
    
    .chatbot-status {
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        opacity: 0.9;
    }
    
    .status-dot {
        width: 8px;
        height: 8px;
        background: #10B981;
        border-radius: 50%;
        animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    
    .chatbot-header-actions {
        display: flex;
        gap: 0.5rem;
    }
    
    .chatbot-action-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
        font-size: 18px;
    }
    
    .chatbot-action-btn:hover {
        background: rgba(255, 255, 255, 0.3);
    }
    
    /* Messages */
    .chatbot-messages {
        flex: 1;
        padding: 1.5rem;
        overflow-y: auto;
        background: var(--color-gray-50);
    }
    
    .chatbot-message {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .chatbot-message.user {
        flex-direction: row-reverse;
    }
    
    .message-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--gradient-primary);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 18px;
    }
    
    .chatbot-message.user .message-avatar {
        background: var(--color-gray-300);
    }
    
    .message-content {
        max-width: 70%;
    }
    
    .chatbot-message.user .message-content {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }
    
    .message-content p {
        background: white;
        padding: 0.75rem 1rem;
        border-radius: var(--radius-lg);
        font-size: 14px;
        line-height: 1.5;
        color: var(--color-gray-800);
        margin-bottom: 0.25rem;
    }
    
    .chatbot-message.user .message-content p {
        background: var(--gradient-primary);
        color: white;
    }
    
    .message-time {
        font-size: 11px;
        color: var(--color-gray-400);
        padding: 0 0.5rem;
    }
    
    /* Quick Actions */
    .chatbot-quick-actions {
        padding: 1rem 1.5rem;
        border-top: 1px solid var(--color-gray-200);
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        background: white;
    }
    
    .quick-action-btn {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        background: var(--color-gray-100);
        border: none;
        border-radius: var(--radius-md);
        font-size: 13px;
        color: var(--color-gray-700);
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 500;
    }
    
    .quick-action-btn:hover {
        background: rgba(153, 38, 243, 0.1);
        color: var(--primary-purple);
    }
    
    .quick-action-btn i {
        font-size: 16px;
    }
    
    /* Typing Indicator */
    .chatbot-typing {
        display: flex;
        gap: 0.75rem;
        padding: 0 1.5rem;
        margin-bottom: 1rem;
    }
    
    .typing-dots {
        background: white;
        padding: 0.75rem 1rem;
        border-radius: var(--radius-lg);
        display: flex;
        gap: 0.25rem;
    }
    
    .typing-dots span {
        width: 8px;
        height: 8px;
        background: var(--color-gray-400);
        border-radius: 50%;
        animation: bounce 1.4s infinite;
    }
    
    .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
    }
    
    .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
    }
    
    @keyframes bounce {
        0%, 60%, 100% {
            transform: translateY(0);
        }
        30% {
            transform: translateY(-8px);
        }
    }
    
    /* Input */
    .chatbot-input {
        display: flex;
        gap: 0.75rem;
        padding: 1rem 1.5rem;
        border-top: 1px solid var(--color-gray-200);
        background: white;
    }
    
    #chatbotTextarea {
        flex: 1;
        padding: 0.75rem;
        border: 2px solid var(--color-gray-200);
        border-radius: var(--radius-md);
        font-size: 14px;
        font-family: var(--font-family);
        resize: none;
        max-height: 120px;
        transition: border-color 0.2s;
    }
    
    #chatbotTextarea:focus {
        outline: none;
        border-color: var(--primary-purple);
    }
    
    .chatbot-send-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--gradient-primary);
        border: none;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        font-size: 18px;
        flex-shrink: 0;
    }
    
    .chatbot-send-btn:hover:not(:disabled) {
        transform: scale(1.05);
    }
    
    .chatbot-send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    
    /* Mobile Responsive */
    @media (max-width: 480px) {
        .chatbot-window {
            width: calc(100vw - 2rem);
            height: calc(100vh - 140px);
            bottom: 80px;
            right: 1rem;
        }
        
        .chatbot-widget {
            right: 1rem;
        }
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatbotButton = document.getElementById('chatbotButton');
    const chatbotWindow = document.getElementById('chatbotWindow');
    const closeChatbot = document.getElementById('closeChatbot');
    const minimizeChatbot = document.getElementById('minimizeChatbot');
    const chatbotSend = document.getElementById('chatbotSend');
    const chatbotTextarea = document.getElementById('chatbotTextarea');
    const chatbotMessages = document.getElementById('chatbotMessages');
    const typingIndicator = document.getElementById('typingIndicator');
    const quickActions = document.querySelectorAll('.quick-action-btn');
    
    // Set welcome time
    document.getElementById('welcomeTime').textContent = getCurrentTime();
    
    // Toggle chatbot
    chatbotButton.addEventListener('click', function() {
        chatbotWindow.classList.toggle('active');
        chatbotButton.classList.toggle('active');
    });
    
    closeChatbot.addEventListener('click', function() {
        chatbotWindow.classList.remove('active');
        chatbotButton.classList.remove('active');
    });
    
    minimizeChatbot.addEventListener('click', function() {
        chatbotWindow.classList.remove('active');
        chatbotButton.classList.remove('active');
    });
    
    // Send message
    chatbotSend.addEventListener('click', sendMessage);
    
    chatbotTextarea.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    
    // Auto-resize textarea
    chatbotTextarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
    });
    
    // Quick actions
    quickActions.forEach(btn => {
        btn.addEventListener('click', function() {
            const message = this.getAttribute('data-message');
            chatbotTextarea.value = message;
            sendMessage();
        });
    });
    
    async function sendMessage() {
        const message = chatbotTextarea.value.trim();
        if (!message) return;
        
        // Add user message
        addMessage(message, 'user');
        chatbotTextarea.value = '';
        chatbotTextarea.style.height = 'auto';
        
        // Show typing indicator
        typingIndicator.style.display = 'flex';
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
        
        try {
            // Call chatbot API
            const token = localStorage.getItem('access_token');
            const response = await fetch(`${APP_CONFIG.apiBaseUrl}/chatbot/message`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token ? `Bearer ${token}` : ''
                },
                body: JSON.stringify({ message })
            });
            
            const data = await response.json();
            
            // Hide typing indicator
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                
                // Add bot response
                if (data.response) {
                    addMessage(data.response, 'bot');
                }
            }, 1000);
            
        } catch (error) {
            console.error('Chatbot error:', error);
            typingIndicator.style.display = 'none';
            addMessage('Sorry, I encountered an error. Please try again later.', 'bot');
        }
    }
    
    function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `chatbot-message ${sender}`;
        
        messageDiv.innerHTML = `
            <div class="message-avatar">
                <i class="ti ti-${sender === 'bot' ? 'robot' : 'user'}"></i>
            </div>
            <div class="message-content">
                <p>${text}</p>
                <span class="message-time">${getCurrentTime()}</span>
            </div>
        `;
        
        chatbotMessages.appendChild(messageDiv);
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
    }
    
    function getCurrentTime() {
        const now = new Date();
        return now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }
});
</script>
