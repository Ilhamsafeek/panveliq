<script>
document.addEventListener('DOMContentLoaded', function() {
    // Load user data
    loadUserData();
    
    // Load notifications
    loadNotifications();
    
    // Toggle notification dropdown
    const notificationBtn = document.getElementById('notificationBtn');
    const notificationDropdown = document.getElementById('notificationDropdown');
    
    if (notificationBtn) {
        notificationBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            notificationDropdown.classList.toggle('active');
            document.getElementById('userDropdown').classList.remove('active');
        });
    }
    
    // Toggle user dropdown
    const userMenuBtn = document.getElementById('userMenuBtn');
    const userDropdown = document.getElementById('userDropdown');
    
    if (userMenuBtn) {
        userMenuBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            userDropdown.classList.toggle('active');
            notificationDropdown.classList.remove('active');
        });
    }
    
    // Close dropdowns when clicking outside
    document.addEventListener('click', function() {
        notificationDropdown.classList.remove('active');
        userDropdown.classList.remove('active');
    });
    
    // Prevent dropdown from closing when clicking inside
    notificationDropdown.addEventListener('click', function(e) {
        e.stopPropagation();
    });
    
    userDropdown.addEventListener('click', function(e) {
        e.stopPropagation();
    });
    
    // Mark all as read
    const markAllReadBtn = document.getElementById('markAllReadBtn');
    if (markAllReadBtn) {
        markAllReadBtn.addEventListener('click', markAllNotificationsAsRead);
    }
    
    // Logout
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            handleLogout();
        });
    }
});

async function loadUserData() {
    try {
        const token = localStorage.getItem('access_token');
        if (!token) return;
        
        const response = await fetch(`${APP_CONFIG.apiBaseUrl}/auth/me`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            const data = await response.json();
            updateUserUI(data);
        }
    } catch (error) {
        console.error('Error loading user data:', error);
    }
}

function updateUserUI(user) {
    document.getElementById('userName').textContent = user.full_name || user.email;
    document.getElementById('userRole').textContent = user.role || 'User';
    document.getElementById('userFullName').textContent = user.full_name || user.email;
    document.getElementById('userEmail').textContent = user.email || '';
    
    if (user.profile_image) {
        document.getElementById('userAvatar').src = user.profile_image;
        document.getElementById('userAvatarLarge').src = user.profile_image;
    }
}

async function loadNotifications() {
    try {
        const token = localStorage.getItem('access_token');
        if (!token) return;
        
        const response = await fetch(`${APP_CONFIG.apiBaseUrl}/notifications`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            const data = await response.json();
            updateNotificationsUI(data.notifications || []);
        }
    } catch (error) {
        console.error('Error loading notifications:', error);
    }
}

function updateNotificationsUI(notifications) {
    const notificationList = document.getElementById('notificationList');
    const notificationCount = document.getElementById('notificationCount');
    
    if (notifications.length === 0) {
        notificationList.innerHTML = `
            <div class="empty-state">
                <i class="ti ti-bell-off"></i>
                <p>No notifications</p>
            </div>
        `;
        notificationCount.style.display = 'none';
        return;
    }
    
    const unreadCount = notifications.filter(n => !n.is_read).length;
    if (unreadCount > 0) {
        notificationCount.textContent = unreadCount;
        notificationCount.style.display = 'flex';
    } else {
        notificationCount.style.display = 'none';
    }
    
    notificationList.innerHTML = notifications.map(notification => `
        <div class="notification-item ${!notification.is_read ? 'unread' : ''}" data-id="${notification.notification_id}">
            <div class="notification-icon ${getNotificationType(notification.notification_type)}">
                <i class="ti ti-${getNotificationIcon(notification.notification_type)}"></i>
            </div>
            <div class="notification-content">
                <p class="notification-title">${notification.title}</p>
                <p class="notification-text">${notification.message}</p>
                <span class="notification-time">${formatTime(notification.created_at)}</span>
            </div>
        </div>
    `).join('');
}

function getNotificationType(type) {
    const types = {
        'success': 'success',
        'warning': 'warning',
        'error': 'error',
        'info': 'info'
    };
    return types[type] || 'info';
}

function getNotificationIcon(type) {
    const icons = {
        'success': 'check-circle',
        'warning': 'alert-triangle',
        'error': 'alert-circle',
        'info': 'info-circle'
    };
    return icons[type] || 'bell';
}

function formatTime(timestamp) {
    const now = new Date();
    const time = new Date(timestamp);
    const diff = Math.floor((now - time) / 1000);
    
    if (diff < 60) return 'Just now';
    if (diff < 3600) return `${Math.floor(diff / 60)} min ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} hour${Math.floor(diff / 3600) > 1 ? 's' : ''} ago`;
    return `${Math.floor(diff / 86400)} day${Math.floor(diff / 86400) > 1 ? 's' : ''} ago`;
}

async function markAllNotificationsAsRead() {
    try {
        const token = localStorage.getItem('access_token');
        if (!token) return;
        
        await fetch(`${APP_CONFIG.apiBaseUrl}/notifications/mark-all-read`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        loadNotifications();
    } catch (error) {
        console.error('Error marking notifications as read:', error);
    }
}

function handleLogout() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('user');
    window.location.href = '/auth/login';
}
</script>
