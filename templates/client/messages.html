{% extends "base.html" %}
{% block title %}Messages - PanvelIQ{% endblock %}
{% set show_sidebar = True %}

{% block extra_css %}
<style>
    .client-messages-container {
        padding: 2rem;
        max-width: 1400px;
        margin: 0 auto;
    }


    .messages-container {
        padding: 2rem;
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 1.5rem;
    }

    .messages-sidebar {
        background: white;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: var(--shadow-md);
        height: fit-content;
    }

    .messages-main {
        background: white;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: var(--shadow-md);
    }

    .message-item {
        padding: 1rem;
        border-radius: 8px;
        margin-bottom: 0.5rem;
        cursor: pointer;
        transition: all 0.2s;
        border-left: 3px solid transparent;
    }

    .message-item:hover {
        background: var(--color-gray-50);
    }

    .message-item.unread {
        background: #EFF6FF;
        border-left-color: var(--primary-purple);
    }

    .message-item.active {
        background: var(--color-gray-100);
    }

    .message-sender {
        font-weight: 600;
        color: var(--color-gray-900);
        margin-bottom: 0.25rem;
    }

    .message-subject {
        font-size: 0.875rem;
        color: var(--color-gray-700);
        margin-bottom: 0.25rem;
    }

    .message-preview {
        font-size: 0.75rem;
        color: var(--color-gray-500);
    }

    .message-detail {
        display: none;
    }

    .message-detail.active {
        display: block;
    }

    .message-header {
        border-bottom: 2px solid var(--color-gray-100);
        padding-bottom: 1rem;
        margin-bottom: 1rem;
    }

    .message-body {
        color: var(--color-gray-700);
        line-height: 1.6;
    }

    .btn-compose {
        width: 100%;
        padding: 0.75rem;
        background: var(--gradient-primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="client-messages-container">
    <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 1.75rem; font-weight: 700;"><i class="ti ti-message"></i> Messages</h1>
        <p style="color: var(--color-gray-600);">Communicate with your team</p>
    </div>

    <div class="messages-container">
        <div class="messages-sidebar">
            <button class="btn-compose" onclick="composeMessage()">
                <i class="ti ti-pencil"></i> Compose Message
            </button>
            <div id="messagesList"></div>
        </div>
        <div class="messages-main">
            <div id="messageDetail">
                <div style="text-align: center; padding: 4rem 2rem; color: var(--color-gray-500);">
                    <i class="ti ti-inbox" style="font-size: 4rem; color: var(--color-gray-300);"></i>
                    <p style="margin-top: 1rem;">Select a message to view</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const APP_CONFIG = { apiBaseUrl: '/api/v1' };
    let currentMessages = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadMessages();
    });

    async function loadMessages() {
        try {
            const response = await fetch(`${APP_CONFIG.apiBaseUrl}/client-pages/messages`, {
                headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
            });

            const data = await response.json();

            if (response.ok) {
                currentMessages = data.messages || [];
                renderMessagesList(currentMessages);
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }

    function renderMessagesList(messages) {
        const list = document.getElementById('messagesList');
        if (messages.length === 0) {
            list.innerHTML = '<p style="text-align: center; color: var(--color-gray-500); padding: 2rem;">No messages</p>';
            return;
        }

        list.innerHTML = messages.map((msg, index) => `
        <div class="message-item ${!msg.is_read ? 'unread' : ''}" onclick="viewMessage(${index})">
            <div class="message-sender">${msg.sender_name || 'Team Member'}</div>
            <div class="message-subject">${msg.subject}</div>
            <div class="message-preview">${new Date(msg.created_at).toLocaleDateString()}</div>
        </div>
    `).join('');
    }

    function viewMessage(index) {
        const msg = currentMessages[index];

        document.querySelectorAll('.message-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });

        document.getElementById('messageDetail').innerHTML = `
        <div class="message-header">
            <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">${msg.subject}</h3>
            <div style="display: flex; justify-content: space-between; font-size: 0.875rem; color: var(--color-gray-600);">
                <span><strong>From:</strong> ${msg.sender_name || 'Team Member'}</span>
                <span>${new Date(msg.created_at).toLocaleString()}</span>
            </div>
        </div>
        <div class="message-body">${msg.message || 'No content'}</div>
    `;

        if (!msg.is_read) {
            markAsRead(msg.message_id);
        }
    }

    async function markAsRead(messageId) {
        try {
            await fetch(`${APP_CONFIG.apiBaseUrl}/client-pages/messages/${messageId}/read`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
            });
        } catch (error) {
            console.error('Error:', error);
        }
    }

    function composeMessage() {
        alert('Compose message functionality - opens modal form');
    }
</script>
{% endblock %}
